[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[project]
name = "gemma-clinc-distillation"
version = "0.1.0"
description = "Reproducible Gemma 4 E2B distillation experiments on CLINC150"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=1.9,<2",
  "bitsandbytes>=0.46,<1",
  "pillow>=11,<12",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers>=5.15,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
gemma-clinc = "gemma_clinc.cli:main"

[tool.uv.build-backend]
module-name = "gemma_clinc"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
